<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#A3253A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Middagar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.png">
<title>Middagar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column like a fridge list, fixed tab bar at the bottom, sheets slide up from below */
:root{
  --bg:#F1F4F0; --surface:#FFFFFF; --soft:#E6ECE7; --ink:#1A2621; --muted:#5D6A64; --line:#D8DFDA;
  --accent:#A3253A; --accent-ink:#FFFFFF; --accent-soft:#F6E3E6;
  --p-kott:#9A3A2C; --p-fisk:#24668C; --p-fagel:#A86E14; --p-vego:#3A7743;
  --warn:#9A5A00; --star:#C98A0B;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#1A221F; --soft:#222C28; --ink:#E5ECE8; --muted:#95A29C; --line:#2B3531;
  --accent:#E8677B; --accent-ink:#1B0D10; --accent-soft:#3A1F24;
  --p-kott:#E48470; --p-fisk:#6DB2DB; --p-fagel:#E6B060; --p-vego:#7FC68B; --warn:#E8B24E; --star:#F2C14E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#1A221F; --soft:#222C28; --ink:#E5ECE8; --muted:#95A29C; --line:#2B3531;
  --accent:#E8677B; --accent-ink:#1B0D10; --accent-soft:#3A1F24;
  --p-kott:#E48470; --p-fisk:#6DB2DB; --p-fagel:#E6B060; --p-vego:#7FC68B; --warn:#E8B24E; --star:#F2C14E; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(92px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:-.01em;margin:0;text-wrap:balance}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.weeknav{display:flex;align-items:center;gap:6px}
.weeknav h1{font-size:34px;line-height:1}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.iconbtn:disabled{opacity:.35}
.iconbtn svg{width:20px;height:20px}
.ghost{border:none;background:transparent}
.dates{font-size:14px;color:var(--muted);margin-top:4px}

/* rhythm strip */
.rhythm{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:4px 0 14px}
.rh{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 7px;border-radius:10px;background:var(--soft);font-size:11px;min-width:0}
.rh b{font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.rh .dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.rh .bas{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 2px}
.rh.clash .bas{color:var(--warn);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-bottom:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}

.pk{background:var(--p-kott)!important}.pf{background:var(--p-fisk)!important}.pg{background:var(--p-fagel)!important}.pv{background:var(--p-vego)!important}
.tk{color:var(--p-kott)}.tf{color:var(--p-fisk)}.tg{color:var(--p-fagel)}.tv{color:var(--p-vego)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* day cards */
.days{display:flex;flex-direction:column;gap:8px}
.day{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:10px;padding:12px 8px 12px 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.day.weekend{background:var(--soft);border-color:transparent}
.dname{display:flex;flex-direction:column;line-height:1.1}
.dname b{font-family:var(--f-display);font-size:17px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.dname span{font-size:13px;color:var(--muted)}
.day.today .dname b{color:var(--accent)}
.dish{min-width:0;text-align:left;border:none;background:none;padding:0}
.dish .t{font-weight:600;font-size:16.5px;line-height:1.25;display:block}
.chips{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px;font-size:13px;color:var(--muted)}
.chips .p{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.chips .p i{width:8px;height:8px;border-radius:50%;display:inline-block}
.dact{display:flex;gap:2px}
.dact .iconbtn{width:38px;height:38px;border:none;background:transparent;color:var(--muted)}
.dact .iconbtn.on{color:var(--accent)}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 5px}
.warn{color:var(--warn);font-weight:600}

.empty{padding:28px 20px;border:1.5px dashed var(--line);border-radius:var(--r);text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h2{font-size:22px}
.empty p{margin:0;color:var(--muted);max-width:40ch}
.actions{display:flex;gap:8px;margin-top:14px}
.actions .btn{flex:1}

/* shop */
.progress{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin:8px 0 4px}
.progress div{height:100%;background:var(--accent);transition:width .25s}
.addform{display:flex;gap:8px;margin:14px 0 10px}
.addform input{flex:1;min-width:0}
input[type=text],input[type=url],input[type=number],input[type=search],select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
textarea{min-height:110px;resize:vertical;line-height:1.4}
.staples{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500}
.chip.add{border-style:dashed;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.added{background:var(--accent-soft);border-color:var(--accent)}
.group{margin-bottom:16px}
.group h3{font-family:var(--f-body);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px 2px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:11px 8px 11px 12px;border-top:1px solid var(--line)}
.item:first-child{border-top:none}
.check{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;background:transparent;padding:0}
.check svg{width:16px;height:16px;opacity:0}
.item.done .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.item.done .check svg{opacity:1}
.item .body{flex:1;min-width:0;text-align:left;border:none;background:none;padding:0}
.item .n{font-weight:600}
.item.done .n{text-decoration:line-through;color:var(--muted);font-weight:500}
.item .q{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500;margin-left:6px}
.item .from{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .x{width:34px;height:34px;border:none;background:none;color:var(--muted)}
.item .x svg{width:16px;height:16px}
.fold{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;padding:6px 2px;color:var(--muted);font-weight:600;font-size:14px}
.fold svg{width:16px;height:16px;transition:transform .2s}
.fold.open svg{transform:rotate(90deg)}

/* recipes */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:10px 0 12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .chip{flex:none}
.rec{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border:none;border-top:1px solid var(--line);background:var(--surface)}
.rec:first-child{border-top:none}
.rec .stripe{flex:none;width:4px;align-self:stretch;border-radius:4px}
.rec .t{font-weight:600}
.rec .m{font-size:13px;color:var(--muted)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;border:none;background:none;color:var(--muted);font-size:12px;font-weight:600;position:relative}
.tabs svg{width:23px;height:23px}
.tabs button[aria-selected=true]{color:var(--accent)}
.badge{position:absolute;top:5px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;line-height:18px;font-variant-numeric:tabular-nums}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,16,14,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:90%;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:8px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.progress div{transition:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.shead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.shead h2{font-size:24px;line-height:1.15}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted);margin-bottom:14px}
.ing{list-style:none;margin:0 0 16px;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.ing li{display:grid;grid-template-columns:84px 1fr;gap:10px;padding:9px 12px;border-top:1px solid var(--line)}
.ing li:first-child{border-top:none}
.ing .q{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.steps{margin:0 0 16px;padding-left:22px;display:flex;flex-direction:column;gap:8px;max-width:62ch}
.steps li::marker{font-weight:700;color:var(--accent)}
.sec{font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}}
.ingrow{display:grid;grid-template-columns:64px 68px 1fr 36px;gap:6px;margin-bottom:6px}
.ingrow select{grid-column:1 / 4;min-height:38px;padding:6px 10px;font-size:14px}
.ingrow input{min-height:42px;padding:8px}
.ingrow .x{border:none;background:none;color:var(--muted)}
.helper{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.helper p{margin:0;font-size:14px;color:var(--muted)}
.status{font-size:14px;color:var(--muted);min-height:1.2em}
.pick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;border:none;border-top:1px solid var(--line);background:var(--surface)}
.pick:first-child{border-top:none}
.daysel{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.daysel button{min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px}
.daysel button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper b{font-family:var(--f-display);font-size:28px;min-width:2ch;text-align:center}
.note{font-size:14px;color:var(--muted);background:var(--soft);border-radius:12px;padding:12px 14px;margin-bottom:14px}

.chips .rest{color:var(--p-vego);font-weight:600}
.chips .rest.miss{color:var(--warn)}
.smart{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.smart ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:14.5px}
.smart li{display:flex;gap:8px;align-items:baseline}
.smart li b{font-weight:600}
.smart li span{color:var(--muted)}
.prep{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px}
.prep summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
.prep summary::-webkit-details-marker{display:none}
.prep summary .muted{font-weight:500;font-size:13.5px}
.prep .chipsrow{display:flex;flex-wrap:wrap;gap:6px}
.prep .chip{min-height:32px;font-size:14px}
.prep form{display:flex;gap:8px}
.prep form input{flex:1;min-width:0;min-height:40px}
.wish{display:grid;grid-template-columns:1fr auto 34px;gap:8px;align-items:center;font-size:15px}
.wish select{min-height:38px;padding:6px 8px;font-size:14px;width:auto}
.wish .x{border:none;background:none;color:var(--muted)}
.blocked{color:var(--warn);font-size:13px;font-weight:600}
.leftnote{font-size:14.5px;background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2)}
.stars{display:flex;gap:2px}
.stars button{width:44px;height:44px;border:none;background:none;padding:0;color:var(--line);display:grid;place-items:center}
.stars button svg{width:30px;height:30px}
.stars button.on{color:var(--star)}
.rate-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:16px;display:flex;flex-direction:column;gap:6px}
.rate-box .who{font-size:14px;color:var(--muted)}
.mini-star{display:inline-flex;align-items:center;gap:3px;color:var(--star);font-weight:700;font-variant-numeric:tabular-nums}
.mini-star svg{width:13px;height:13px}
.skel{height:64px;border-radius:var(--r);background:var(--soft);margin-bottom:8px}
#onboard{max-width:480px;margin:0 auto;padding:40px max(20px,env(safe-area-inset-left,0px)) 40px max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
#onboard h1{font-size:40px;line-height:1.05}
#onboard p{margin:0;color:var(--muted);max-width:42ch}
#onboard img{width:84px;height:84px;border-radius:20px}
</style>
</head>
<body>
<div id="onboard" hidden></div>
<div class="wrap" id="app">
  <header class="top">
    <div>
      <div class="weeknav">
        <button class="iconbtn ghost" data-act="prevw" aria-label="Föregående vecka"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <h1 id="wk" class="num">Vecka</h1>
        <button class="iconbtn ghost" data-act="nextw" aria-label="Nästa vecka"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
      <div class="dates num" id="dates" style="padding-left:46px"></div>
    </div>
    <button class="iconbtn" data-act="settings" aria-label="Inställningar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
  </header>

  <div id="notice"></div>

  <section id="view-week"></section>

  <section id="view-shop" hidden>
    <div class="row" style="justify-content:space-between">
      <h2 style="font-size:26px">Handlingslista</h2>
      <span class="muted num" id="shop-count"></span>
    </div>
    <div class="progress"><div id="shop-bar" style="width:0"></div></div>
    <form class="addform" id="add-form">
      <input type="text" id="add-input" placeholder="Lägg till vara, t.ex. havregryn" autocomplete="off" enterkeyhint="done">
      <button class="btn primary" type="submit" aria-label="Lägg till"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </form>
    <div class="row" style="justify-content:space-between;margin-bottom:6px">
      <span class="eyebrow">Basvaror</span>
      <button class="btn small ghost" data-act="staple-edit" id="staple-edit-btn" style="border:none;background:none;color:var(--muted)">Redigera</button>
    </div>
    <div id="staples" class="staples"></div>
    <div id="shop-list"></div>
  </section>

  <section id="view-rec" hidden>
    <div class="row" style="justify-content:space-between">
      <h2 style="font-size:26px">Recept</h2>
      <button class="btn small primary" data-act="new-rec"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nytt recept</button>
    </div>
    <div style="margin-top:12px"><input type="search" id="rec-q" placeholder="Sök recept eller ingrediens"></div>
    <div class="filters" id="rec-filters"></div>
    <div id="rec-list"></div>
  </section>
</div>

<nav class="tabs" role="tablist">
  <div class="in">
    <button role="tab" data-act="tab" data-tab="week" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>Vecka</button>

<script>
(() => {
"use strict";
const DAYS=["Måndag","Tisdag","Onsdag","Torsdag","Fredag","Lördag","Söndag"];
const DS=["Mån","Tis","Ons","Tor","Fre","Lör","Sön"];
const MON=["jan","feb","mar","apr","maj","jun","jul","aug","sep","okt","nov","dec"];
const PROT={kott:"Kött",fisk:"Fisk",fagel:"Fågel",vego:"Vego"};
const PCLS={kott:"k",fisk:"f",fagel:"g",vego:"v"};
const BAS={ris:"Ris",pasta:"Pasta",potatis:"Potatis",brod:"Bröd",nudlar:"Nudlar",gryn:"Gryn",ovrigt:"Övrigt"};
const CATS=[["gront","Frukt & grönt"],["brod","Bröd"],["kott","Kött, fågel & fisk"],["mejeri","Mejeri & ägg"],["torr","Torrvaror & konserver"],["frys","Frys"],["skafferi","Skafferi – kolla hemma"],["hushall","Hushåll"],["ovrigt","Övrigt"],["rest","Rester från tidigare dag"]];
const CATN=Object.fromEntries(CATS);
const UNITS=["g","kg","dl","l","msk","tsk","krm","st","klyfta","knippe","burk","förp","paket"];
const DEF_STAPLES=[{n:"Mjölk",c:"mejeri"},{n:"Filmjölk",c:"mejeri"},{n:"Yoghurt",c:"mejeri"},{n:"Smör",c:"mejeri"},{n:"Ost",c:"mejeri"},{n:"Ägg",c:"mejeri"},{n:"Bröd",c:"brod"},{n:"Knäckebröd",c:"brod"},{n:"Müsli",c:"torr"},{n:"Kaffe",c:"torr"},{n:"Bananer",c:"gront"},{n:"Äpplen",c:"gront"},{n:"Apelsiner",c:"gront"},{n:"Pålägg",c:"kott"},{n:"Juice",c:"mejeri"},{n:"Toapapper",c:"hushall"}];

const S={db:null,sample:null,canWrite:true,ready:false,recipes:new Map(),recLoaded:false,
  week:null,weekLoaded:false,items:new Map(),itemsLoaded:false,
  settings:{servings:4,helg:[4,5,6],allergens:[],avoid:[]},plan:{have:[],wishes:[]},staples:DEF_STAPLES,stapleEdit:false,
  tab:"week",monday:null,uid:null,user:null,names:{},ratings:{},base:new Map(),over:new Map(),hid:null,all:new Map(),hidden:new Set(),cid:null,pool:null,offline:false,sheet:null,edit:null,recFilter:"alla",showDone:false,busy:false,unsub:[]};

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();const w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7);return{y,w}}
function weekId(mon){const {y,w}=isoWeek(mon);return y+"-W"+String(w).padStart(2,"0")}
const wid=()=>weekId(S.monday);
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function fmtNum(q){if(q==null||q==="")return"";let v=+q;if(!isFinite(v))return"";const r=Math.round(v*10)/10;return String(r).replace(".",",")}
function scaleQ(q,u,f){if(q==null||q==="")return null;let v=q*f;
  if(u==="g"){v=v>=100?Math.round(v/10)*10:Math.max(5,Math.round(v/5)*5)}
  else if(["st","klyfta","burk","förp","paket","knippe"].includes(u)){v=Math.max(0.5,Math.ceil(v*2-0.01)/2)}
  else v=Math.round(v*10)/10;
  return v}
function fmtQU(q,u){const n=fmtNum(q);if(!n)return u&&u!=="st"?u:"";return u&&u!=="st"?n+" "+u:n+(u==="st"?" st":"")}
function slug(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9|]+/g,"-").replace(/\|/g,"~").replace(/^-+|-+$/g,"").slice(0,150)||"x"}
function dayCat(d){return S.settings.helg.includes(d)?"helg":"vardag"}
function getR(id){return id?(S.all.get(id)||S.recipes.get(id)):null}
function guessCat(n){const s=n.toLowerCase();
  const m=[["mejeri",/mjölk|fil|yoghurt|grädde|smör|ost|ägg|kvarg|crème|creme|gräddfil|juice/],["brod",/bröd|knäcke|tortilla|pita|bulle|fralla|baguette/],["gront",/äpple|banan|apelsin|päron|druv|citron|lime|lök|tomat|gurka|sallad|paprika|morot|potatis|avokado|frukt|bär|kiwi|melon|spenat|broccoli|svamp|vitlök|ingefära|örter|persilja|dill/],["kott",/kött|färs|kyckling|korv|bacon|skinka|pålägg|lax|torsk|fisk|räk|fläsk|biff/],["frys",/fryst|glass|frys/],["hushall",/toa|papper|disk|tvätt|tvål|schampo|blöj|soppåse|folie|batteri/],["torr",/pasta|ris|mjöl|socker|gryn|müsli|flingor|kaffe|te$|bönor|linser|konserv|krossade|buljong/]];
  for(const [c,re] of m) if(re.test(s)) return c; return "ovrigt"}
function toast(msg){const r=$("#toast-root");r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML="",2600)}
async function pool(tasks,n=6){let i=0;const run=async()=>{while(i<tasks.length){const t=tasks[i++];await t()}};await Promise.all(Array.from({length:Math.min(n,tasks.length)},run))}

const IC={
  swap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9a8 8 0 0 1 14-3l2 2M20 4v4h-4M20 15a8 8 0 0 1-14 3l-2-2M4 20v-4h4"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  unlock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/></svg>',
  dice:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.2" fill="currentColor"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  cart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.5l2.2 11.2a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.2L21 8H6.3"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h0M4 12h0M4 18h0"/></svg>'
};

/* ---------- ratings ---------- */
function rating(r){const m=(r&&S.ratings[r.id])||{};const vals=Object.values(m).map(Number).filter(v=>v>=1&&v<=5);
  const avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;return{avg,n:vals.length,mine:S.uid?(+m[S.uid]||0):0,map:m}}
function miniStar(r){const {avg}=rating(r);return avg?`<span class="mini-star" aria-label="Betyg ${fmtNum(avg)} av 5">${IC.star}${fmtNum(avg)}</span>`:""}
function weight(r){const {avg}=rating(r);if(!avg)return 1;return [0,0.08,0.35,1,1.8,2.8][Math.round(avg)]||1}
function pickW(arr){const ws=arr.map(weight);let t=ws.reduce((a,b)=>a+b,0)*Math.random();for(let i=0;i<arr.length;i++){t-=ws[i];if(t<=0)return arr[i]}return arr[arr.length-1]}
async function setRating(id,v){
  if(!guardWrite())return;
  if(!S.uid){toast("Logga in i Claude för att betygsätta.");return}
  const r=getR(id);if(!r)return;const cur=rating(r).mine;const nv=cur===v?0:v;
  S.ratings={...S.ratings,[id]:{...(S.ratings[id]||{}),[S.uid]:nv}};renderSheet();render();
  try{await S.db.doc("ratings/"+id).set({[S.uid]:nv},{merge:true})}catch(e){handleErr(e)}}
async function resolveNames(ids){
  if(!S.user)return;const miss=ids.filter(i=>i!==S.uid&&!(i in S.names));if(!miss.length)return;
  miss.forEach(i=>S.names[i]="");
  try{const ps=await S.user.profiles(miss);for(const i of miss)S.names[i]=(ps&&ps[i]&&ps[i].name)||""}catch(e){}
  if(S.sheet&&(S.sheet.type==="rec"||S.sheet.type==="day"))renderSheet()}

/* ---------- smart planering: rester och gemensamma färskvaror ---------- */
const LEFT={ris:{label:"ris",re:/^(ris|jasminris|basmatiris|långkornigt ris|fullkornsris)$/,units:["dl"]},
  potatis:{label:"potatis",re:/^(fast |mjölig )?potatis$/,units:["g","kg"]}};
function srcIng(r,type){if(!r||r.uses||r.onepot||!LEFT[type]||r.bas!==type)return null;const L=LEFT[type];
  return (r.ing||[]).find(g=>g&&L.re.test((g.n||"").toLowerCase().trim())&&L.units.includes(g.u))||null}
function findSrc(rs,e,type){for(let d=e-1;d>=Math.max(0,e-4);d--)if(srcIng(rs[d],type))return d;return -1}
function leftLinks(days){const rs=weekRecs(days);const byUser={},bySrc={};
  rs.forEach((r,e)=>{if(!r||!r.uses)return;const t=r.uses.type;const d=findSrc(rs,e,t);
    if(d>=0){byUser[e]={d,type:t};(bySrc[d]=bySrc[d]||[]).push({e,type:t})}});
  return{byUser,bySrc}}
function srcOk(r,e,days){if(!r.uses)return true;const rs=weekRecs(days);return findSrc(rs,e,r.uses.type)>=0}
const PARTIAL=/vitkål|rödkål|kinakål|purjolök|selleri|dill|persilja|koriander|basilika|gräslök|timjan|salvia|ruccola|spenat|sallad|grädde|crème fraiche|gräddfil|turkisk yoghurt|mozzarella|fetaost|ricotta|halloumi|ingefära|salladslök|sockerärtor|böngroddar|champinjoner|zucchini|aubergine|broccoli|blomkål|tzatziki|parmesan|kvarg|cheddar/;
function normIng(n){n=(n||"").toLowerCase().replace(/\(.*?\)/g,"").trim();
  if(/^(vispgrädde|grädde)$/.test(n))return"grädde";if(/parmesan/.test(n))return"parmesan";
  if(/^(isbergssallad|sallad|romansallad)$/.test(n))return"sallad";if(/koriander/.test(n))return"koriander";
  if(/basilika/.test(n))return"basilika";if(/spenat/.test(n))return"spenat";if(/riven ingefära|^ingefära/.test(n))return"ingefära";return n}
function sharedIngs(days){const rs=weekRecs(days);const m=new Map();
  rs.forEach((r,d)=>{if(!r)return;new Set((r.ing||[]).filter(g=>g&&(g.c==="gront"||g.c==="mejeri")).map(g=>normIng(g.n))).forEach(n=>{if(!PARTIAL.test(n))return;if(!m.has(n))m.set(n,[]);m.get(n).push(d)})});
  return m}
function smartScore(days){const rs=weekRecs(days);let s=0;
  for(const ds of sharedIngs(days).values()){if(ds.length>1)s+=Math.min(ds.length-1,2)*5;else s-=1.5}
  const {byUser}=leftLinks(days);rs.forEach((r,e)=>{if(r&&r.uses)s+=byUser[e]?12:-40});
  return s}
function restChip(d,LL,r){
  if(r&&r.uses){const L=LL.byUser[d];return L?`<span class="rest">↺ ${LEFT[r.uses.type].label} från ${DS[L.d].toLowerCase()}</span>`:`<span class="rest miss">Kokar eget ${LEFT[r.uses.type].label}</span>`}
  const S2=LL.bySrc[d];if(S2&&S2.length){const t=[...new Set(S2.map(x=>LEFT[x.type].label))].join(" och ");return `<span class="rest">Koka extra ${t}</span>`}
  return ""}
function smartBox(days,LL){
  const items=[];
  for(const [e,L] of Object.entries(LL.byUser)){const u=getR(days[e].r),src=getR(days[L.d].r);const g=srcIng(src,L.type);
    const f=(S.settings.servings||4)/((u&&u.servings)||4);const q=scaleQ((u.uses.q||0)*f,g.u,1);
    items.push(`<li><b>${DAYS[L.d]}:</b> <span>koka ${esc(fmtQU(q,g.u))} extra ${LEFT[L.type].label} till ${esc(u.name.toLowerCase())} på ${DAYS[e].toLowerCase()}</span></li>`)}
  const sh=[...sharedIngs(days).entries()].filter(([n,ds])=>ds.length>1).sort((a,b)=>b[1].length-a[1].length).slice(0,6);
  sh.forEach(([n,ds])=>items.push(`<li><b>${esc(n.charAt(0).toUpperCase()+n.slice(1))}:</b> <span>${ds.map(d=>DS[d].toLowerCase()).join(", ")}</span></li>`));
  if(!items.length)return "";
  return `<div class="smart"><span class="eyebrow">Smart handling</span><ul>${items.join("")}</ul></div>`}
function leftNote(r,d){
  if(d==null||!S.week||!S.week.days)return "";const days=S.week.days;const LL=leftLinks(days);const f0=S.settings.servings||4;
  if(r.uses){const L=LL.byUser[d];const f=f0/(r.servings||4);
    if(L){const src=getR(days[L.d].r);return `<div class="leftnote">Använder kokt ${LEFT[r.uses.type].label} från ${DAYS[L.d].toLowerCase()} (${esc(src.name.toLowerCase())}). Det extra är redan med på handlingslistan.</div>`}
    return `<div class="leftnote">Ingen rätt med ${LEFT[r.uses.type].label} tidigare i veckan. Koka ${esc(fmtQU(scaleQ((r.uses.q||0)*f,r.uses.u,1),r.uses.u))} ${LEFT[r.uses.type].label} innan, eller använd rester du har hemma.</div>`}
  const S2=LL.bySrc[d];if(!S2||!S2.length)return "";
  return `<div class="leftnote">`+S2.map(x=>{const u=getR(days[x.e].r);const g=srcIng(r,x.type);const f=f0/(u.servings||4);
    return `Koka ${esc(fmtQU(scaleQ((u.uses.q||0)*f,g.u,1),g.u))} extra ${LEFT[x.type].label} idag och spara i kylen till ${esc(u.name.toLowerCase())} på ${DAYS[x.e].toLowerCase()}.`}).join(" ")+`</div>`}

/* ---------- har hemma, önskerätter, allergier ---------- */
const ALLERGENS={
  notter:{label:"Nötter",re:/nötter|cashew|mandel|valnöt|pinjenöt|hasselnöt|pistage|jordnöt|pekannöt/},
  skaldjur:{label:"Skaldjur",re:/räk|mussl|kräft|vongole|gambas|hummer|krabba|(?<!vegansk )scampi/},
  fisk:{label:"Fisk",re:/fisk|lax|torsk|sej|kummel|strömming|tonfisk|rödspätta|abborre|ansjovis|sill|makrill/},
  mjolk:{label:"Mjölk/laktos",re:/(?<!kokos)mjölk|grädde|(?<!jordnöts)smör|ost$|ost |parmesan|mozzarella|feta|halloumi|ricotta|crème|creme|yoghurt|kvarg|filmjölk|gräddfil|tzatziki|bearnaise|cheddar|getost|ädelost|gorgonzola|västerbotten|färskost|pepparrotskräm|vitlökssås/},
  gluten:{label:"Gluten",re:/vetemjöl|mjöl$|pasta|spaghetti|penne|fusilli|farfalle|rigatoni|linguine|tagliatelle|pappardelle|makaroner|lasagne|cannelloni|orzo|ströbröd|panko|bröd|tortilla|pita|naan|baguette|ciabatta|couscous|bulgur|äggnudlar|udonnudlar|gnocchi|smördeg|filodeg|dumpling|lättöl|rågmjöl/},
  agg:{label:"Ägg",re:/ägg|majonnäs|aioli|bearnaise|remoulad/},
  selleri:{label:"Selleri",re:/selleri/},
  sesam:{label:"Sesam",re:/sesam|tahini/},
  senap:{label:"Senap",re:/senap/}};
const SYN={svamp:/svamp|champinjon|kantarell|shiitake|karljohan/,lök:/lök/,koriander:/koriander/,chili:/chili|sambal|sriracha|jalapeñ/};
function ingNames(r){return (r.ing||[]).filter(g=>g&&g.n&&g.c!=="rest").map(g=>g.n.toLowerCase())}
function blockedBy(r){
  const names=ingNames(r);const hits=[];
  for(const k of (S.settings.allergens||[])){const A=ALLERGENS[k];if(A&&names.some(n=>A.re.test(n)))hits.push(A.label)}
  for(const w of (S.settings.avoid||[])){const lw=w.toLowerCase();const re=SYN[lw];if(names.some(n=>re?re.test(n):n.includes(lw)))hits.push(w)}
  return hits}
function isBlocked(r){return blockedBy(r).length>0}
function usesHave(r,w){const lw=w.toLowerCase();const re=SYN[lw];return ingNames(r).some(n=>re?re.test(n):(n.includes(lw)||lw.includes(normIng(n))&&normIng(n).length>2))}
function haveScore(days){const have=(S.plan&&S.plan.have)||[];if(!have.length)return 0;const rs=weekRecs(days).filter(Boolean);
  let s=0;for(const w of have){const n=rs.filter(r=>usesHave(r,w)).length;if(n)s+=10+Math.min(n-1,1)*2}return s}
function isHome(name){const have=(S.plan&&S.plan.have)||[];const n=name.toLowerCase();return have.some(w=>{const lw=w.toLowerCase();const re=SYN[lw];if(re)return re.test(n);const e=lw.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");return new RegExp("(^|\\s)"+e).test(n)||normIng(n)===lw})}
async function savePlan(p){if(!guardWrite())return;S.plan={have:[],wishes:[],...S.plan,...p};render();
  try{await S.db.doc("plans/"+wid()).set({have:S.plan.have||[],wishes:S.plan.wishes||[],updatedAt:Date.now()})}catch(e){handleErr(e)}}
function planSub(){const id=wid();S.plan={have:[],wishes:[]};
  return S.db.doc("plans/"+id).onSnapshot(s=>{if(id!==wid())return;const d=s.exists?s.data():{};S.plan={have:d.have||[],wishes:d.wishes||[]};render()},e=>console.error(e))}
function prepBox(open){
  const p=S.plan||{have:[],wishes:[]};const have=p.have||[],wishes=(p.wishes||[]).filter(w=>getR(w.r));
  const sum=[have.length?`${have.length} hemma`:"",wishes.length?`${wishes.length} önskad${wishes.length>1?"e":""}`:""].filter(Boolean).join(" · ")||"Valfritt";
  return `<details class="prep" ${open?"open":""}><summary><span>Inför slumpningen</span><span class="muted">${sum}</span></summary>
    <div><div class="eyebrow" style="margin-bottom:6px">Har hemma</div>

    <p class="muted" style="font-size:13px;margin:6px 0 0">Slumpningen väljer gärna rätter som använder det ni har, och det bockas av direkt på handlingslistan.</p></div>

    ${wishes.map((w,i)=>`<div class="wish"><span>${esc(getR(w.r).name)}</span><select data-act="wish-day" data-i="${i}" id="wish-day-${i}" aria-label="Dag"><option value="">Valfri dag</option>${DS.map((n,d)=>`<option value="${d}"${w.d===d?" selected":""}>${n}</option>`).join("")}</select><button class="x" data-act="wish-del" data-i="${i}" aria-label="Ta bort önskerätt">${IC.x.replace('<svg','<svg width="16" height="16"')}</button></div>`).join("")}

/* ---------- rules ---------- */
function weekRecs(days){return (days||[]).map(x=>x&&getR(x.r))}
function basClash(rs,d){const b=rs[d]?.bas;if(!b||b==="ovrigt")return false;return rs[d-1]?.bas===b||rs[d+1]?.bas===b}
function scoreWeek(days){const rs=weekRecs(days);let s=0,perfect=true;
  const has=p=>rs.some(r=>r&&r.protein===p);
  if(has("kott"))s+=40;else perfect=false; if(has("fisk"))s+=40;else perfect=false;
  for(let d=1;d<7;d++){const a=rs[d-1],b=rs[d];if(!a||!b)continue;
    if(a.bas===b.bas&&a.bas!=="ovrigt"){s-=60;perfect=false}
    if(a.protein===b.protein){s-=6;perfect=false}}
  rs.forEach((r,d)=>{if(r&&r.cat!==dayCat(d)){s-=20;perfect=false}});
  s+=new Set(rs.filter(Boolean).map(r=>r.protein)).size*3;
  s+=smartScore(days)+haveScore(days);
  return {s,perfect}}
async function randomize(){
  const all=[...S.recipes.values()].filter(r=>!isBlocked(r));
  if(all.length<7){toast("Lägg till minst 7 recept först.");return}
  const cur0=(S.week&&S.week.days)||Array(7).fill(null);
  const wishes=((S.plan&&S.plan.wishes)||[]).filter(w=>getR(w.r));
  const fixedW=wishes.filter(w=>w.d!=null&&w.d!=="");const freeW=wishes.filter(w=>w.d==null||w.d==="");
  let prevIds=new Set();
  try{const pw=await S.db.doc("weeks/"+weekId(addDays(S.monday,-7))).get();if(pw.exists)(pw.data().days||[]).forEach(x=>x&&x.r&&prevIds.add(x.r))}catch(e){}
  let best=null,bestS=-1e9;
  for(let a=0;a<500;a++){
    const cur=cur0.map(x=>x&&x.lock?{...x}:null);
    for(const w of fixedW)cur[+w.d]={r:w.r,lock:true,wish:true};
    let wok=true;
    for(const w of freeW){if(cur.some(x=>x&&x.r===w.r))continue;const wr=getR(w.r);
      const free=[0,1,2,3,4,5,6].filter(d=>!cur[d]);const pref=free.filter(d=>dayCat(d)===wr.cat);
      const pool2=pref.length?pref:free;if(!pool2.length){wok=false;break}
      cur[pool2[Math.floor(Math.random()*pool2.length)]]={r:w.r,lock:true,wish:true}}
    if(!wok)continue;
    const days=[],used=new Set(cur.filter(x=>x&&x.lock&&x.r).map(x=>x.r));let ok=true;
    for(let d=0;d<7;d++){
      const c=cur[d];
      if(c&&c.lock&&c.r){days.push(c.wish?{r:c.r,lock:!!(cur0[d]&&cur0[d].lock&&cur0[d].r===c.r),wish:true}:{r:c.r,lock:true});continue}
      const prev=days[d-1]?getR(days[d-1].r):null;
      const nx=cur[d+1]&&cur[d+1].lock?getR(cur[d+1].r):null;
      const nb=[prev&&prev.bas,nx&&nx.bas].filter(b=>b&&b!=="ovrigt");
      const fits=r=>!used.has(r.id)&&(r.bas==="ovrigt"||!nb.includes(r.bas));
      let cand=all.filter(r=>r.cat===dayCat(d)&&fits(r));
      if(!cand.length)cand=all.filter(fits);
      if(!cand.length){ok=false;break}
      const fresh=cand.filter(r=>!prevIds.has(r.id));
      const r=pickW(fresh.length?fresh:cand);
      used.add(r.id);days.push({r:r.id,lock:false});
    }
    if(!ok)continue;
    const s=scoreWeek(days).s+Math.random()*4;
    if(s>bestS){best=days;bestS=s}
  }
  if(!best){toast("Hittade ingen kombination. Lägg till fler recept.");return}
  await saveWeek(best,"Ny vecka slumpad");
}
function candidatesFor(d,days,{strict=true}={}){
  const all=[...S.recipes.values()].filter(r=>!isBlocked(r));const rs=weekRecs(days);
  const used=new Set(days.map(x=>x&&x.r).filter(Boolean));
  const nb=[rs[d-1]&&rs[d-1].bas,rs[d+1]&&rs[d+1].bas].filter(b=>b&&b!=="ovrigt");
  const cur=rs[d];
  const others=rs.filter((r,i)=>i!==d&&r);
  let need=null;
  if(cur&&(cur.protein==="fisk"||cur.protein==="kott")&&!others.some(o=>o.protein===cur.protein))need=cur.protein;
  const tiers=[
    r=>r.cat===dayCat(d)&&(r.bas==="ovrigt"||!nb.includes(r.bas))&&(!need||r.protein===need)&&srcOk(r,d,days),
    r=>r.cat===dayCat(d)&&(r.bas==="ovrigt"||!nb.includes(r.bas))&&srcOk(r,d,days),
    r=>(r.bas==="ovrigt"||!nb.includes(r.bas)),
    r=>true];
  for(const t of tiers){const c=all.filter(r=>!used.has(r.id)&&t(r));if(c.length)return c}
  return []}
async function swapDay(d){
  const days=clone(S.week.days);const c=candidatesFor(d,days);
  if(!c.length){toast("Inga fler recept att byta till.");return}
  let best=null,bs=-1e9;
  for(let i=0;i<14;i++){const r=pickW(c);const t=clone(days);t[d]={r:r.id,lock:false};const sc=scoreWeek(t).s+Math.random()*6;if(sc>bs){bs=sc;best=r}}
  days[d]={r:best.id,lock:false};
  await saveWeek(days,DAYS[d]+" bytt");
}
function clone(x){return JSON.parse(JSON.stringify(x))}

/* ---------- writes ---------- */
function guardWrite(){if(!S.canWrite){toast("Du har bara läsbehörighet.");return false}return true}
async function saveWeek(days,msg){
  if(!guardWrite())return;
  const id=wid();
  S.week={days};S.weekLoaded=true;render();
  try{await S.db.doc("weeks/"+id).set({days,updatedAt:Date.now()});
    await syncList(days,id);
    if(msg)toast(msg)}
  catch(e){handleErr(e)}
}
function desiredItems(days){
  const out=new Map();const f0=S.settings.servings||4;
  const add=(n,u,q,c,from)=>{n=String(n).trim();u=(u||"").trim();const key=n.toLowerCase()+"|"+u.toLowerCase();const id="r-"+slug(key);
    let it=out.get(id);
    if(!it){it={n:n.charAt(0).toUpperCase()+n.slice(1),u,q:null,c:c&&CATN[c]&&c!=="rest"?c:"ovrigt",from:[],raw:0,hasQ:false};out.set(id,it)}
    if(q!=null&&q!==""&&isFinite(+q)){it.raw+=+q;it.hasQ=true}
    if(from&&!it.from.includes(from))it.from.push(from)};
  (days||[]).forEach(x=>{const r=x&&getR(x.r);if(!r)return;const f=f0/(r.servings||4);
    (r.ing||[]).forEach(g=>{if(!g||!g.n||g.c==="rest")return;add(g.n,g.u,g.q!=null&&g.q!==""?(+g.q)*f:null,g.c,r.name)})});
  const LL=leftLinks(days);
  (days||[]).forEach((x,e)=>{const r=x&&getR(x.r);if(!r||!r.uses)return;const q=(r.uses.q||0)*(f0/(r.servings||4));const L=LL.byUser[e];
    if(L){const g=srcIng(getR(days[L.d].r),L.type);add(g.n,g.u,q,g.c,r.name+" (rester)")}
    else add(LEFT[r.uses.type].label,r.uses.u,q,r.uses.type==="ris"?"torr":"gront",r.name)});
  for(const it of out.values()){it.q=it.hasQ?scaleQ(it.raw,it.u,1):null;delete it.raw;delete it.hasQ}
  return out}
async function syncList(days,id){
  const col=S.db.collection("shop/"+id+"/items");
  let existing;
  if(S.itemsLoaded&&id===wid())existing=new Map(S.items);
  else{existing=new Map();const snap=await col.get();snap.docs.forEach(d=>existing.set(d.id,d.data()))}
  const want=desiredItems(days);const tasks=[];
  for(const [k,v] of existing) if(v.source==="recipe"&&!want.has(k)) tasks.push(()=>col.doc(k).delete());
  for(const [k,v] of want){const ex=existing.get(k);
    if(!ex){const home=isHome(v.n);tasks.push(()=>col.doc(k).set({...v,source:"recipe",checked:home,home,at:Date.now()}))}
    else if(ex.q!==v.q||ex.n!==v.n||ex.c!==v.c||(ex.from||[]).join("|")!==v.from.join("|")) tasks.push(()=>col.doc(k).update({q:v.q,n:v.n,u:v.u,c:v.c,from:v.from}));}
  await pool(tasks,6)}
async function addManual(name,cat){
  if(!guardWrite())return;
  name=name.trim();if(!name)return;
  const dup=[...S.items.values()].find(i=>!i.checked&&i.n.toLowerCase()===name.toLowerCase());

  const doc={n:name.charAt(0).toUpperCase()+name.slice(1),q:null,u:"",c:cat||guessCat(name),checked:false,source:"manual",from:[],at:Date.now()};
  S.items.set(id,doc);renderShop();
  try{await S.db.doc("shop/"+wid()+"/items/"+id).set(doc)}catch(e){handleErr(e)}
}
function handleErr(e){console.error(e);const c=e&&e.code;
  if(c==="permission-denied")toast("Ingen åtkomst till hushållet. Kontrollera inbjudningslänken.");
  else if(c==="resource-exhausted")toast("Gratiskvoten för idag är slut. Försök igen i morgon.");

function recDetail(r,d){
  const f=(S.settings.servings||4)/(r.servings||4);
  const ing=(r.ing||[]).map(g=>`<li><span class="q">${esc(fmtQU(g.q!=null&&g.q!==""?scaleQ(+g.q,g.u,f):null,g.u))}</span><span>${esc(g.n)}</span></li>`).join("");
  const steps=(r.steps||[]).map(s=>`<li>${esc(s)}</li>`).join("");
  let h=`<div class="shead"><div>${d!=null?`<div class="eyebrow">${DAYS[d]} ${addDays(S.monday,d).getDate()}/${addDays(S.monday,d).getMonth()+1}</div>`:""}<h2>${esc(r.name)}</h2></div><button class="iconbtn" data-act="close-sheet" aria-label="Stäng">${IC.x}</button></div>
  <div class="meta"><span class="t${PCLS[r.protein]}" style="font-weight:600">${PROT[r.protein]}</span><span>${BAS[r.bas]}</span><span class="num">${r.time} min</span><span>${r.cat==="helg"?"Helgrätt":"Vardagsrätt"}</span>${r.onepot?"<span>One pot</span>":""}</div>`;
  if(d!=null){const x=S.week.days[d]||{};h+=`<div class="row" style="margin-bottom:16px"><button class="btn small" data-act="swap" data-d="${d}" ${x.lock?"disabled":""}>${IC.swap}Slumpa ny</button><button class="btn small" data-act="pick" data-d="${d}">${IC.list}Välj själv</button><button class="btn small" data-act="lock" data-d="${d}">${x.lock?IC.lock+"Låst":IC.unlock+"Lås"}</button></div>`}
  {const b=blockedBy(r);if(b.length)h+=`<p class="blocked">Innehåller ${esc(b.join(", "))}</p>`}
  h+=leftNote(r,d);
  h+=rateBox(r);
  h+=`<div class="sec">Ingredienser · <span class="num">${S.settings.servings}</span> portioner</div><ul class="ing">${ing||'<li><span></span><span class="muted">Inga ingredienser angivna</span></li>'}</ul>`;
  if(steps)h+=`<div class="sec">Gör så här</div><ol class="steps">${steps}</ol>`;
  if(r.url)h+=`<p><a href="${esc(r.url)}" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600;display:inline-flex;gap:6px;align-items:center">${IC.link.replace('<svg','<svg width="18" height="18"')}Originalrecept</a></p>`;
  if(r.by)h+=`<p class="muted" style="font-size:14px">Tillagd av ${esc(r.by)}${r.hh===S.hid?"":" i ett annat hushåll"}.</p>`;
  if(d==null){const hid=S.hidden.has(r.id);const mine=r.hh===S.hid&&!S.base.has(r.id);
    h+=`<div class="row" style="margin-top:8px"><button class="btn small" data-act="edit-rec" data-id="${esc(r.id)}">Redigera</button>${hid?`<button class="btn small" data-act="unhide-rec" data-id="${esc(r.id)}">Visa igen</button>`:`<button class="btn small" data-act="hide-rec" data-id="${esc(r.id)}">Dölj för oss</button>`}${mine?`<button class="btn small danger" data-act="del-rec" data-id="${esc(r.id)}">Ta bort för alla</button>`:""}</div>
    <p class="muted" style="font-size:13px">${hid?"Rätten är dold för ert hushåll och kommer inte med i slumpningen.":"Dölj tar bort rätten bara för ert hushåll. Andra hushåll som ni delar recept med behåller den."}</p>`}
  return h}
function rateBox(r){
  const ra=rating(r);
  const stars=[1,2,3,4,5].map(v=>`<button data-act="rate" data-id="${esc(r.id)}" data-v="${v}" class="${v<=ra.mine?"on":""}" aria-label="${v} av 5 stjärnor" ${S.canWrite&&S.uid?"":"disabled"}>${IC.star}</button>`).join("");
  const others=Object.entries(ra.map).filter(([u,v])=>u!==S.uid&&+v>=1);
  const who=others.map(([u,v])=>`${esc(u)} ${v}`).join(" · ");
  return `<div class="rate-box"><div class="row" style="justify-content:space-between"><span class="eyebrow">Ditt betyg</span>${ra.avg?`<span class="mini-star" style="font-size:15px">${IC.star}${fmtNum(ra.avg)} <span class="muted" style="font-weight:500">(${ra.n})</span></span>`:'<span class="who">Inga betyg än</span>'}</div>
    <div class="stars">${stars}</div>${who?`<div class="who">${who}</div>`:""}</div>`}

    <div class="chipsrow" style="display:flex;flex-wrap:wrap;gap:6px">${Object.entries(ALLERGENS).map(([k,A])=>`<button class="chip${(S.settings.allergens||[]).includes(k)?" on":""}" data-act="allergen" data-k="${k}" aria-pressed="${(S.settings.allergens||[]).includes(k)}">${A.label}</button>`).join("")}</div>
    <div class="sec">Ingredienser vi inte vill ha</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px">${(S.settings.avoid||[]).map((w,i)=>`<button class="chip on" data-act="avoid-del" data-i="${i}" aria-label="Ta bort ${esc(w)}">${esc(w)} ✕</button>`).join("")}</div>
    <form id="avoid-form" class="row" style="margin-top:6px"><input type="text" id="avoid-input" placeholder="t.ex. koriander, svamp, oliver" style="flex:1;min-width:0" autocomplete="off"><button class="btn small" type="submit">Lägg till</button></form>

    <div class="sec">Bjud in till ert hushåll</div>

    <div class="sec">Du</div>
    <div class="row"><input type="text" id="me-name" value="${esc(S.uid||"")}" style="flex:1;min-width:0" aria-label="Ditt namn"><button class="btn small" data-act="save-name">Spara namn</button></div>

  else if(s.type==="edit"){inner=editorHtml()}

function wrapSheet(inner){return `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${inner}</div></div>`}
function renderPickList(){
  const s=S.sheet;const q=$("#pick-q").value;const days=(S.week&&S.week.days)||Array(7).fill(null);const rs=weekRecs(days);
  const nb=[rs[s.d-1]&&rs[s.d-1].bas,rs[s.d+1]&&rs[s.d+1].bas].filter(b=>b&&b!=="ovrigt");
  const inWeek=new Set(days.map(x=>x&&x.r));
  let list=filteredRecipes(q,"alla");
  const cat=dayCat(s.d);list.sort((a,b)=>(a.cat===cat?0:1)-(b.cat===cat?0:1));
  $("#pick-list").innerHTML=`<div class="list">`+list.map(r=>{
    const bl=blockedBy(r);const warn=bl.length?"Innehåller "+bl.join(", "):s.wish?"":nb.includes(r.bas)?`Samma tillbehör som dagen intill`:inWeek.has(r.id)?"Redan i veckan":"";
    return recRow(r,"pick-choose").replace("</span></span></button>",`</span>${warn?`<span class="warn" style="display:block;font-size:12.5px">${warn}</span>`:""}</span></button>`)}).join("")+`</div>`}

function blankRec(){return{name:"",cat:"vardag",protein:"kott",bas:"potatis",time:30,servings:4,url:"",ing:[{q:"",u:"g",n:"",c:"ovrigt"}],steps:[]}}
function opts(map,sel){return Object.entries(map).map(([k,v])=>`<option value="${k}"${k===sel?" selected":""}>${v}</option>`).join("")}

  <form id="rec-form" style="display:flex;flex-direction:column;gap:12px">

function collectForm(){
  const r=S.edit.data;const v=id=>{const el=document.getElementById(id);return el?el.value:""};
  r.name=v("re-name").trim();r.cat=v("re-cat");r.protein=v("re-prot");r.bas=v("re-bas");
  r.time=Math.max(5,parseInt(v("re-time"))||30);r.servings=Math.max(1,parseInt(v("re-serv"))||4);r.url=v("re-url").trim();
  r.ing=r.ing.map((g,i)=>{const q=v("re-q-"+i).replace(",",".").trim();return{q:q===""?null:(isFinite(+q)?+q:null),u:v("re-u-"+i),n:v("re-n-"+i).trim(),c:v("re-c-"+i)||"ovrigt"}});
  r.steps=v("re-steps").split("\n").map(s=>s.trim()).filter(Boolean)}
function normRec(o){
  const r=blankRec();if(!o||typeof o!=="object")return r;
  r.name=String(o.name||"").slice(0,120);
  r.cat=o.cat==="helg"?"helg":"vardag";
  r.protein=PROT[o.protein]?o.protein:"vego";
  r.bas=BAS[o.bas]?o.bas:"ovrigt";
  r.time=Math.max(5,Math.round(+o.time)||30);
  r.servings=Math.max(1,Math.round(+o.servings)||4);
  r.ing=(Array.isArray(o.ingredients||o.ing)?(o.ingredients||o.ing):[]).slice(0,40).map(g=>({q:g&&g.q!=null&&isFinite(+g.q)?+g.q:null,u:UNITS.includes(g&&g.u)?g.u:"",n:String(g&&g.n||"").slice(0,80),c:CATN[g&&g.c]?g.c:"ovrigt"})).filter(g=>g.n);
  if(!r.ing.length)r.ing=[{q:null,u:"",n:"",c:"ovrigt"}];
  r.steps=(Array.isArray(o.steps)?o.steps:[]).map(s=>String(s).slice(0,400)).slice(0,12);
  return r}
const SCHEMA=`{"name":string,"cat":"vardag"|"helg","protein":"kott"|"fisk"|"fagel"|"vego","bas":"ris"|"pasta"|"potatis"|"brod"|"nudlar"|"gryn"|"ovrigt","time":number,"servings":number,"ingredients":[{"q":number|null,"u":string,"n":string,"c":"gront"|"brod"|"kott"|"mejeri"|"torr"|"frys"|"skafferi"|"ovrigt"}],"steps":[string]}`;
const RULES=`Regler: allt på svenska. time = total tid i minuter. cat = "vardag" om rätten är enkel och tar högst ca 40 minuter, annars "helg". protein = huvudproteinet (nöt, fläsk, lamm och chark = "kott"; kyckling och kalkon = "fagel"; fisk och skaldjur = "fisk"; annars "vego"). bas = huvudsakligt tillbehör eller kolhydrat (bulgur, couscous, quinoa = "gryn"; tortilla, pizza, pitabröd = "brod"). u är en av: g, kg, dl, l, msk, tsk, krm, st, klyfta, knippe, burk, förp, paket, eller "" om ingen enhet passar. n = kort varunamn utan mängd, t.ex. "gul lök". c = butiksavdelning; salt, peppar, olja, vetemjöl, socker och torkade kryddor ska ha c="skafferi". steps = högst 8 korta instruktioner formulerade med egna ord.`;
function imStatus(t){const el=$("#imp-status");if(el)el.textContent=t}
async function runSample(prompt,btnId){
  if(!S.sample){imStatus("Claude-hjälpen är inte tillgänglig här.");return null}
  const btn=document.getElementById(btnId);if(btn)btn.disabled=true;
  imStatus("Claude läser…");
  try{const o=await S.sample.json(prompt,{cache:false});return o}
  catch(e){const c=e&&e.code;
    imStatus(c==="not_granted"||c==="sampling_disabled"?"Claude-hjälpen är avstängd för den här sidan.":c==="rate_limited"?"För många förfrågningar just nu. Vänta en stund.":c==="invalid_json"?"Kunde inte tolka svaret. Försök igen.":c==="refused"?"Claude kunde inte hjälpa till med den texten.":"Något gick fel. Försök igen.");
    return null}
  finally{if(btn)btn.disabled=false}}
async function doParse(){
  const text=($("#imp-text").value||"").trim();const url=($("#imp-url").value||"").trim();
  if(text.length<40){imStatus("Klistra in receptets text först. Claude kan inte öppna länkar själv.");return}
  const o=await runSample(`Du får texten från en receptsida. Plocka ut själva receptet och svara med ENDAST ett JSON-objekt enligt schemat:\n${SCHEMA}\n${RULES}\n\nTEXT:\n${text.slice(0,18000)}`,"parse-btn");
  if(!o)return;
  collectForm();const r=normRec(o);r.url=url||S.edit.data.url;S.edit.data=r;renderSheet();
  setTimeout(()=>{imStatus("Klart. Kontrollera och spara.");const f=$("#rec-form");if(f)f.scrollIntoView({behavior:"smooth",block:"start"})},30)}
async function doSuggest(){
  const wish=($("#sug-wish").value||"").trim();collectForm();
  const cat=S.edit.data.cat;
  const names=[...S.recipes.values()].map(r=>r.name).join("; ");
  const o=await runSample(`Föreslå ett nytt recept på en omtyckt hemlagad middag för en svensk familj, ${cat==="helg"?"en lite mer ambitiös helgrätt (45–120 min)":"en enkel vardagsrätt (högst 35 min)"} för 4 portioner, med ingredienser som finns i en vanlig svensk mataffär.${wish?" Önskemål: "+wish+".":""} Föreslå inte något av dessa som redan finns: ${names.slice(0,4000)}.\nSvara med ENDAST ett JSON-objekt enligt schemat:\n${SCHEMA}\n${RULES}`,"sug-btn");
  if(!o)return;
  S.edit.data=normRec(o);renderSheet();setTimeout(()=>imStatus("Här är ett förslag. Ändra gärna innan du sparar."),30)}
async function saveRecipe(){
  if(!guardWrite())return;
  collectForm();const r=S.edit.data;
  if(!r.name){toast("Ge receptet ett namn");return}
  r.ing=r.ing.filter(g=>g.n);
  const id=S.edit.id||("u-"+slug(r.name).slice(0,40)+"-"+Date.now().toString(36));
  const prev=S.edit.id?getR(S.edit.id):null;
  const doc={name:r.name,cat:r.cat,protein:r.protein,bas:r.bas,time:r.time,servings:r.servings,url:r.url,ing:r.ing,steps:r.steps,updatedAt:Date.now(),
    by:(prev&&prev.by)||(prev&&S.base.has(prev.id)?"":S.uid),hh:(prev&&prev.hh)||(prev&&S.base.has(prev.id)?"":S.hid),editedBy:S.uid};
  if(prev&&prev.uses)doc.uses=prev.uses;
  if(prev&&prev.onepot)doc.onepot=true;
  const btn=$("#save-btn");if(btn)btn.disabled=true;
  try{await S.pool.doc("recipes/"+id).set(doc);S.over.set(id,doc);mergeRecipes();closeSheet();toast("Receptet är sparat");render();
    if(S.week&&S.week.days&&S.week.days.some(x=>x&&x.r===id))await syncList(S.week.days,wid())}
  catch(e){if(btn)btn.disabled=false;handleErr(e)}}

/* ---------- events ---------- */
document.addEventListener("click",async ev=>{
  const el=ev.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,d=el.dataset.d!=null?+el.dataset.d:null,id=el.dataset.id;
  if(a==="scrim"){if(ev.target===el)closeSheet();return}
  switch(a){
    case"tab":S.tab=el.dataset.tab;closeSheet();render();window.scrollTo({top:0});break;
    case"prevw":case"nextw":S.monday=addDays(S.monday,a==="prevw"?-7:7);subscribeWeek();render();break;
    case"settings":openSheet({type:"settings"});break;
    case"close-sheet":closeSheet();break;
    case"shuffle":if(!guardWrite())return;el.disabled=true;await randomize();break;
    case"swap":if(!guardWrite())return;await swapDay(d);break;
    case"lock":{if(!guardWrite())return;const days=clone(S.week.days);days[d]={...days[d],lock:!days[d].lock};S.week={days};render();
      try{await S.db.doc("weeks/"+wid()).set({days,updatedAt:Date.now()})}catch(e){handleErr(e)}break}
    case"open-day":if(getR(S.week.days[d]&&S.week.days[d].r))openSheet({type:"day",d});break;
    case"open-rec":openSheet({type:"rec",id});break;
    case"pick":openSheet({type:"pick",d});break;
    case"pick-choose":{if(!guardWrite())return;
      if(S.sheet.wish){const ws=((S.plan&&S.plan.wishes)||[]).filter(w=>w.r!==id);ws.push({r:id,d:null});closeSheet();await savePlan({wishes:ws});toast("Önskerätt tillagd. Slumpa veckan så kommer den med.");break}
      const dd=S.sheet.d;const days=clone(S.week.days);
      const ex=days.findIndex((x,i)=>i!==dd&&x&&x.r===id);if(ex>=0)days[ex]={r:days[dd].r,lock:false};
      days[dd]={r:id,lock:days[dd]&&days[dd].lock||false};closeSheet();await saveWeek(days,DAYS[dd]+": "+getR(id).name);break}
    case"tog":{if(!guardWrite())return;const it=S.items.get(id);if(!it)return;const v=!it.checked;S.items.set(id,{...it,checked:v});renderShop();
      try{await S.db.doc("shop/"+wid()+"/items/"+id).update({checked:v})}catch(e){handleErr(e)}break}
    case"del-item":{if(!guardWrite())return;S.items.delete(id);renderShop();try{await S.db.doc("shop/"+wid()+"/items/"+id).delete()}catch(e){handleErr(e)}break}
    case"toggle-done":S.showDone=!S.showDone;renderShop();break;
    case"regen":if(!guardWrite())return;if(!S.week||!S.week.days){toast("Ingen veckoplan att hämta från");return}
      el.disabled=true;try{await syncList(S.week.days,wid());toast("Listan är uppdaterad")}catch(e){handleErr(e)}el.disabled=false;break;
    case"staple":{const s=S.staples[+el.dataset.i];if(s)await addManual(s.n,s.c);break}
    case"staple-edit":S.stapleEdit=!S.stapleEdit;renderStaples();if(S.stapleEdit){const i=$("#staple-input");if(i)i.focus()}break;
    case"staple-del":{if(!guardWrite())return;const list=S.staples.slice();list.splice(+el.dataset.i,1);S.staples=list;renderStaples();
      try{await S.db.doc("config/staples").set({items:list})}catch(e){handleErr(e)}break}
    case"wish-add":openSheet({type:"pick",wish:true});break;
    case"wish-del":{const ws=[...((S.plan&&S.plan.wishes)||[])];ws.splice(+el.dataset.i,1);await savePlan({wishes:ws});break}
    case"have-del":{const hv=[...((S.plan&&S.plan.have)||[])];hv.splice(+el.dataset.i,1);await savePlan({have:hv});break}
    case"allergen":{if(!guardWrite())return;const k=el.dataset.k;const a=new Set(S.settings.allergens||[]);a.has(k)?a.delete(k):a.add(k);S.settings={...S.settings,allergens:[...a]};renderSheet();render();await saveSettings(false);break}
    case"avoid-del":{if(!guardWrite())return;const a=[...(S.settings.avoid||[])];a.splice(+el.dataset.i,1);S.settings={...S.settings,avoid:a};renderSheet();render();await saveSettings(false);break}
    case"share-inv":{const k=el.dataset.k||"hh";const url=inviteLink(k);
      try{if(navigator.share){await navigator.share({title:"Middagar",text:"Gå med i vår matsedel",url});break}}catch(e){if(e&&e.name==="AbortError")break}
      try{await navigator.clipboard.writeText(url);toast("Länken är kopierad")}catch(e){$("#inv-link-"+k).select();toast("Markera och kopiera länken")}break}
    case"copy-inv":{const k=el.dataset.k||"hh";try{await navigator.clipboard.writeText(inviteLink(k));toast("Länken är kopierad")}catch(e){$("#inv-link-"+k).select();toast("Markera och kopiera länken")}break}
    case"save-name":{const n=($("#me-name").value||"").trim();if(!n)return;
      const old=S.uid;S.uid=n;lsSet("vm_name",n);
      if(old&&old!==n){const tasks=[];for(const [rid,m] of Object.entries(S.ratings)){if(m[old]>0){const v=m[old];tasks.push(()=>S.db.doc("ratings/"+rid).set({[n]:v,[old]:0},{merge:true}))}}await pool(tasks,4)}
      toast("Namnet är sparat");render();break}
    case"rate":await setRating(id,+el.dataset.v);break;
    case"filter":S.recFilter=el.dataset.f;renderRecipes();break;
    case"new-rec":if(!guardWrite())return;S.edit={id:null,data:blankRec()};openSheet({type:"edit"});break;
    case"edit-rec":{const r=getR(id);if(!r)return;S.edit={id,data:normRec({...r,ingredients:r.ing})};S.edit.data.url=r.url||"";openSheet({type:"edit"});break}
    case"del-rec":{if(!guardWrite())return;if(!el.dataset.sure){el.dataset.sure="1";el.textContent="Säker? Tryck igen";return}
      try{await S.pool.doc("recipes/"+id).set({deleted:true,updatedAt:Date.now()});S.over.set(id,{deleted:true});mergeRecipes();closeSheet();toast("Receptet är borttaget för alla");render()}catch(e){handleErr(e)}break}
    case"hide-rec":{S.hidden=new Set([...S.hidden,id]);mergeRecipes();closeSheet();render();toast("Dold för ert hushåll");
      try{await S.db.doc("hidden/"+id).set({by:S.uid,at:Date.now()})}catch(e){handleErr(e)}break}
    case"unhide-rec":{const h=new Set(S.hidden);h.delete(id);S.hidden=h;mergeRecipes();renderSheet();render();toast("Rätten är tillbaka");
      try{await S.db.doc("hidden/"+id).delete()}catch(e){handleErr(e)}break}
    case"add-ing":collectForm();S.edit.data.ing.push({q:null,u:"",n:"",c:"ovrigt"});renderSheet();
      setTimeout(()=>{const i=document.getElementById("re-q-"+(S.edit.data.ing.length-1));if(i)i.focus()},20);break;
    case"del-ing":collectForm();S.edit.data.ing.splice(+el.dataset.i,1);if(!S.edit.data.ing.length)S.edit.data.ing.push({q:null,u:"",n:"",c:"ovrigt"});renderSheet();break;
    case"parse":ev.preventDefault();await doParse();break;
    case"suggest":ev.preventDefault();await doSuggest();break;
    case"serv":{if(!guardWrite())return;const n=Math.min(12,Math.max(1,S.settings.servings+(+el.dataset.v)));if(n===S.settings.servings)return;
      S.settings={...S.settings,servings:n};renderSheet();await saveSettings(true);break}
    case"helg":{if(!guardWrite())return;const h=new Set(S.settings.helg);h.has(d)?h.delete(d):h.add(d);S.settings={...S.settings,helg:[...h].sort()};renderSheet();await saveSettings(false);break}
  }
});
let settingsTimer;
async function saveSettings(resync){clearTimeout(settingsTimer);settingsTimer=setTimeout(async()=>{
  try{await S.db.doc("config/settings").set(S.settings);if(resync&&S.week&&S.week.days)await syncList(S.week.days,wid());render()}catch(e){handleErr(e)}},600)}
document.addEventListener("submit",async ev=>{
  ev.preventDefault();
  if(ev.target.id==="add-form"){const i=$("#add-input");const v=i.value;i.value="";await addManual(v);i.focus()}
  else if(ev.target.id==="staple-form"){if(!guardWrite())return;const i=$("#staple-input");const n=i.value.trim();if(!n)return;
    const list=[...S.staples,{n:n.charAt(0).toUpperCase()+n.slice(1),c:guessCat(n)}];S.staples=list;renderStaples();const ni=$("#staple-input");if(ni)ni.focus();
    try{await S.db.doc("config/staples").set({items:list})}catch(e){handleErr(e)}}
  else if(ev.target.id==="rec-form")await saveRecipe();
  else if(ev.target.id==="have-form"){const v=($("#have-input").value||"").trim().toLowerCase();if(!v)return;
    const hv=[...((S.plan&&S.plan.have)||[])];v.split(",").map(x=>x.trim()).filter(Boolean).forEach(x=>{if(!hv.includes(x))hv.push(x)});await savePlan({have:hv});
    const i=$("#have-input");if(i)i.focus()}
  else if(ev.target.id==="avoid-form"){if(!guardWrite())return;const v=($("#avoid-input").value||"").trim().toLowerCase();if(!v)return;
    const a=[...(S.settings.avoid||[])];v.split(",").map(x=>x.trim()).filter(Boolean).forEach(x=>{if(!a.includes(x))a.push(x)});S.settings={...S.settings,avoid:a};renderSheet();render();await saveSettings(false);
    const i=$("#avoid-input");if(i)i.focus()}
});
document.addEventListener("change",async ev=>{
  const el=ev.target;if(el.dataset&&el.dataset.act==="wish-day"){const ws=[...((S.plan&&S.plan.wishes)||[])];const i=+el.dataset.i;if(!ws[i])return;
    ws[i]={...ws[i],d:el.value===""?null:+el.value};await savePlan({wishes:ws})}});
document.addEventListener("input",ev=>{
  if(ev.target.id==="rec-q")renderRecList();
  if(ev.target.id==="pick-q")renderPickList();
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&S.sheet)closeSheet()});

/* ---------- data ---------- */
// Struktur i Firestore:
//   households/{hid}            { cid }  ett hushåll: veckor, handlingslistor, betyg, inställningar, dolda rätter
//   circles/{cid}/recipes/{id}  receptkrets som flera hushåll delar: inlagda och redigerade recept
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function inviteLink(kind){const b=location.origin+location.pathname;return kind==="fam"?b+"#family="+S.cid:b+"#join="+S.hid+"."+S.cid}
function newId(){const a=new Uint8Array(16);crypto.getRandomValues(a);return Array.from(a,b=>b.toString(16).padStart(2,"0")).join("")}
function mergeRecipes(){
  const m=new Map();
  for(const [id,r] of S.base)m.set(id,{...r,id});
  for(const [id,o] of S.over){if(o.deleted)m.delete(id);else m.set(id,{...(S.base.get(id)||{}),...o,id})}
  S.all=m;
  const vis=new Map();for(const [id,r] of m)if(!S.hidden.has(id))vis.set(id,r);
  S.recipes=vis}
function subscribeWeek(){
  S.unsub.forEach(u=>u());S.unsub=[];
  S.week=null;S.weekLoaded=false;S.items=new Map();S.itemsLoaded=false;
  if(!S.db)return;const id=wid();
  S.unsub.push(S.db.doc("weeks/"+id).onSnapshot(s=>{if(id!==wid())return;S.week=s.exists?s.data():null;S.weekLoaded=true;render()},e=>{console.error(e);S.weekLoaded=true;render()}));
  S.unsub.push(planSub());
  S.unsub.push(S.db.collection("shop/"+id+"/items").onSnapshot(s=>{if(id!==wid())return;const m=new Map();s.docs.forEach(d=>m.set(d.id,d.data()));S.items=m;S.itemsLoaded=true;
    if(S.tab==="shop")renderShop();else renderHeader()},e=>{console.error(e);S.itemsLoaded=true;render()}));
}
function hideApp(){$("#app").hidden=true;document.querySelector(".tabs").hidden=true;const ob=$("#onboard");ob.hidden=false;return ob}
function showOnboard(inv){
  // inv: null (nytt hushåll och ny receptkrets) | {type:"hh",hid,cid} | {type:"fam",cid}
  const ob=hideApp();
  const title=!inv?"Veckans middagar":inv.type==="hh"?"Välkommen till hushållets matsedel":"Välkommen till receptkretsen";
  const text=!inv?"Slumpa veckans middagar, få en handlingslista och dela allt med familjen."
    :inv.type==="hh"?"Du har blivit inbjuden till ett hushåll. Ni delar matsedel och handlingslista."
    :"Du får en egen matsedel och handlingslista, och ser recepten som de andra i kretsen lägger in.";
  ob.innerHTML=`<img src="icons/icon-192.png" alt=""><h1>${title}</h1><p>${text}</p>
    <div class="field"><label for="ob-name">Ditt namn</label><input type="text" id="ob-name" autocomplete="given-name" placeholder="t.ex. Henrik"></div>
    <button class="btn primary block" id="ob-go">${!inv?"Skapa vårt hushåll":inv.type==="hh"?"Gå med":"Skapa vårt hushåll"}</button>
    <p style="font-size:13px">Lägg appen på hemskärmen: tryck på Dela-knappen i Safari och välj "Lägg till på hemskärmen".</p>`;
  $("#ob-go").onclick=()=>{const n=($("#ob-name").value||"").trim();if(!n){$("#ob-name").focus();return}
    lsSet("vm_name",n);
    if(inv&&inv.type==="hh"){lsSet("vm_hid",inv.hid);lsSet("vm_cid",inv.cid||"")}
    else{lsSet("vm_hid",newId());lsSet("vm_cid",inv?inv.cid:newId());lsSet("vm_new","1");if(!inv)lsSet("vm_import","1")}
    history.replaceState(null,"",location.pathname);location.reload()};
}
function showConfigMissing(){
  const ob=hideApp();
  ob.innerHTML=`<img src="icons/icon-192.png" alt=""><h1>Nästan klart</h1><p>Appen saknar koppling till databasen. Firebase-uppgifterna behöver läggas in i config.js.</p>`}
async function runImport(){
  // Engångsimport av veckoplan, handlingslista, inställningar och betyg från Claude-versionen.
  let imp;try{const r=await fetch("import.json",{cache:"no-cache"});if(!r.ok)return;imp=await r.json()}catch(e){return}
  const tasks=[];
  for(const [w,d] of Object.entries(imp.weeks||{}))tasks.push(()=>S.db.doc("weeks/"+w).set({...d,updatedAt:Date.now()}));
  for(const [w,items] of Object.entries(imp.shop||{}))for(const [id,it] of Object.entries(items))tasks.push(()=>S.db.doc("shop/"+w+"/items/"+id).set(it));
  if(imp.settings)tasks.push(()=>S.db.doc("config/settings").set(imp.settings));
  for(const [rid,v] of Object.entries(imp.myRatings||{}))tasks.push(()=>S.db.doc("ratings/"+rid).set({[S.uid]:v},{merge:true}));
  await pool(tasks,8);toast("Er plan och lista är överförda")}
function parseInvite(){
  let m=location.hash.match(/^#join=([0-9a-f]{32})(?:\.([0-9a-f]{32}))?$/);if(m)return{type:"hh",hid:m[1],cid:m[2]||""};
  m=location.hash.match(/^#family=([0-9a-f]{32})$/);if(m)return{type:"fam",cid:m[1]};
  return null}
async function init(){
  const now=new Date();S.monday=mondayOf(now);if(now.getDay()===0)S.monday=addDays(S.monday,7);
  const cfg=window.FIREBASE_CONFIG;
  if(!cfg||!cfg.apiKey){showConfigMissing();return}
  const inv=parseInvite();
  const hid=lsGet("vm_hid"),name=lsGet("vm_name");let cid=lsGet("vm_cid");
  if(inv&&!(inv.type==="hh"&&inv.hid===hid)&&!(inv.type==="fam"&&inv.cid===cid)){showOnboard(inv);return}
  if(inv)history.replaceState(null,"",location.pathname);
  if(!hid||!name){showOnboard(null);return}
  S.hid=hid;S.uid=name;render();
  firebase.initializeApp(cfg);
  const fs=firebase.firestore();
  try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}
  try{await firebase.auth().signInAnonymously()}catch(e){console.error(e);toast("Kunde inte ansluta. Kontrollera nätet.")}
  const hhRef=fs.doc("households/"+hid);
  if(lsGet("vm_new")==="1"){try{await hhRef.set({cid,createdAt:Date.now()},{merge:true});lsSet("vm_new","0")}catch(e){console.error(e)}}
  if(!cid){try{const d=await hhRef.get();cid=d.exists&&d.data().cid||""}catch(e){}
    if(!cid){cid=newId();try{await hhRef.set({cid},{merge:true})}catch(e){}}
    lsSet("vm_cid",cid)}
  S.cid=cid;
  const base="households/"+hid+"/",cbase="circles/"+cid+"/";
  S.db={doc:p=>fs.doc(base+p),collection:p=>fs.collection(base+p)};
  S.pool={doc:p=>fs.doc(cbase+p),collection:p=>fs.collection(cbase+p)};
  S.ready=true;
  if(lsGet("vm_import")==="1"){try{await runImport();lsSet("vm_import","0")}catch(e){console.error(e)}}
  S.offline=!navigator.onLine;
  window.addEventListener("online",()=>{S.offline=false;renderNotice()});
  window.addEventListener("offline",()=>{S.offline=true;renderNotice()});
  try{const res=await fetch("recipes.json",{cache:"no-cache"});const arr=await res.json();S.base=new Map(arr.map(r=>[r.id,r]))}catch(e){console.error(e)}
  mergeRecipes();
  S.pool.collection("recipes").onSnapshot(s=>{const m=new Map();s.docs.forEach(d=>m.set(d.id,d.data()));S.over=m;mergeRecipes();S.recLoaded=true;render()},e=>{console.error(e);S.recLoaded=true;render()});
  S.db.collection("hidden").onSnapshot(s=>{S.hidden=new Set(s.docs.map(d=>d.id));mergeRecipes();render()},e=>console.error(e));
  S.db.collection("ratings").onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.ratings=m;render()},e=>console.error(e));
  S.db.doc("config/settings").onSnapshot(s=>{if(s.exists){const d=s.data();S.settings={servings:+d.servings||4,helg:Array.isArray(d.helg)?d.helg:[4,5,6],allergens:Array.isArray(d.allergens)?d.allergens:[],avoid:Array.isArray(d.avoid)?d.avoid:[]};render()}});
  S.db.doc("config/staples").onSnapshot(s=>{if(s.exists&&Array.isArray(s.data().items))S.staples=s.data().items;if(S.tab==="shop")renderStaples()});
  subscribeWeek();render();
  if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
}
init();
})();
</script>
