<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Riskbank BAS-P</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap">
<style>
:root{
  --bg:#F3F2EE; --surface:#FFFFFF; --soft:#E9E7E1; --ink:#1C2230; --muted:#5E6573; --line:#D9D6CF;
  --accent:#1F3A5F; --accent-ink:#FFFFFF; --accent-soft:#DFE7F1; --mark:#E2A100;
  --lag:#2F7D4A; --lag-bg:#DDEFE3; --medel:#A86A00; --medel-bg:#FBEBC8; --hog:#B3261E; --hog-bg:#F7DAD7;
  --f-head:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",-apple-system,"Segoe UI",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151B; --surface:#1A1F28; --soft:#222834; --ink:#E6E8EC; --muted:#9AA1AE; --line:#2C3340;
  --accent:#8DB2E0; --accent-ink:#0E1520; --accent-soft:#1F2C3E; --mark:#F0B429;
  --lag:#6CC08A; --lag-bg:#173022; --medel:#F0B429; --medel-bg:#3A2E10; --hog:#F08A80; --hog-bg:#3E1A18;
}}
:root[data-theme="dark"]{
  --bg:#12151B; --surface:#1A1F28; --soft:#222834; --ink:#E6E8EC; --muted:#9AA1AE; --line:#2C3340;
  --accent:#8DB2E0; --accent-ink:#0E1520; --accent-soft:#1F2C3E; --mark:#F0B429;
  --lag:#6CC08A; --lag-bg:#173022; --medel:#F0B429; --medel-bg:#3A2E10; --hog:#F08A80; --hog-bg:#3E1A18;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-text-size-adjust:100%}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-head);line-height:1.2;margin:0}
h1{font-size:28px} h2{font-size:20px;margin-bottom:10px} h3{font-size:16px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header.top{background:var(--accent);color:var(--accent-ink)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:14px;padding-bottom:14px}
header.top a{color:inherit;text-decoration:none;font-family:var(--f-head);font-size:20px;font-weight:700;letter-spacing:.2px}
header.top .tag{margin-left:auto;font-size:12px;opacity:.85}
.stripe{height:6px;background:repeating-linear-gradient(-45deg,var(--mark) 0 12px,var(--ink) 12px 24px)}
main{padding:20px 0 60px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Bank layout */
.bank{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}
@media (max-width:820px){.bank{grid-template-columns:1fr}}
.panel h2{font-size:17px}
.q{margin:12px 0}
.q label.ql{display:block;font-weight:600;font-size:13px;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 11px;font:500 13px var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
input[type=number],input[type=search]{width:100%;font:15px var(--f-body);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;font:600 13px var(--f-body);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.filters{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.filters .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters .row > span{font-size:12px;font-weight:600;color:var(--muted);width:100%}
.count{font-size:13px;color:var(--muted);margin:4px 0 10px}

.list{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:1fr auto;gap:6px 14px;text-decoration:none;color:inherit}
.item:hover{border-color:var(--accent)}
.item h3{font-size:17px}
.item .meta{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1}
.pill{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--ink);white-space:nowrap}
.pill.sr{background:var(--ink);color:var(--bg)}
.pill.draft{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.rel{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px}
.rel.ja{background:var(--hog-bg);color:var(--hog)}
.rel.mojlig{background:var(--medel-bg);color:var(--medel)}
.rel.nej{background:var(--soft);color:var(--muted)}
.item.dim{opacity:.55}
.levels{display:flex;gap:6px;align-items:center;justify-content:flex-end}
.lvl{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:13px;padding:3px 8px;border-radius:6px;font-variant-numeric:tabular-nums}
.lvl.Låg{background:var(--lag-bg);color:var(--lag)} .lvl.Medel{background:var(--medel-bg);color:var(--medel)} .lvl.Hög{background:var(--hog-bg);color:var(--hog)}
.arrow{color:var(--muted)}

/* Riskblad */
.sheet{display:flex;flex-direction:column;gap:16px}
.sheet-head{display:flex;flex-direction:column;gap:10px}
.sheet-head .back{font-size:13px}
.sheet-head .pill{white-space:normal}
.sheet,.sheet > *{min-width:0}
.ingress{font-size:17px;max-width:72ch}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.alert{border-left:4px solid var(--hog);background:var(--hog-bg);padding:10px 12px;border-radius:6px}
.alert.medel{border-color:var(--medel);background:var(--medel-bg)}
.alert b{display:block;margin-bottom:2px}

.matrix-wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.matrix{display:grid;grid-template-columns:22px repeat(4,40px);grid-template-rows:repeat(4,40px) 22px;gap:3px;font-size:12px}
.matrix .cell{display:flex;align-items:center;justify-content:center;border-radius:4px;font-weight:600;font-variant-numeric:tabular-nums;position:relative}
.matrix .ax{display:flex;align-items:center;justify-content:center;color:var(--muted)}
.matrix .cell.Låg{background:var(--lag-bg);color:var(--lag)} .matrix .cell.Medel{background:var(--medel-bg);color:var(--medel)} .matrix .cell.Hög{background:var(--hog-bg);color:var(--hog)}
.matrix .cell.fore{outline:3px solid var(--ink);outline-offset:-3px}
.matrix .cell.efter{box-shadow:inset 0 0 0 3px var(--ink);border-radius:50%}
.matrix-legend{font-size:13px;display:flex;flex-direction:column;gap:8px;flex:1;min-width:220px}
.mk{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:6px}
.mk.f{outline:3px solid var(--ink);outline-offset:-3px}
.mk.e{box-shadow:inset 0 0 0 3px var(--ink);border-radius:50%}

ul.plain{margin:0;padding-left:18px}
ul.plain li{margin:4px 0}
.forekomst{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.forekomst .f{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
.forekomst .f b{display:block;font-size:14px;margin-bottom:2px}

.flow{display:flex;flex-direction:column;gap:10px}
.step{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface)}
.step .n{font-size:12px;color:var(--muted);font-weight:600}
.step .btns{display:flex;gap:8px;margin-top:8px}
.step.answered{opacity:.75}
.step .ans{font-weight:700}
.result{border-radius:8px;padding:12px;font-weight:500}
.result.hog{background:var(--hog-bg);border-left:4px solid var(--hog)}
.result.medel{background:var(--medel-bg);border-left:4px solid var(--medel)}
.result.lag{background:var(--lag-bg);border-left:4px solid var(--lag)}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600}
td.sk{white-space:nowrap}
.tbl-scroll{overflow-x:auto}
.checklist label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.checklist input{margin-top:4px;width:16px;height:16px;accent-color:var(--accent)}
.checklist .sk{margin-left:auto;font-size:12px}
code.gid{font-size:12px;background:var(--soft);padding:1px 5px;border-radius:4px;color:var(--muted)}
code{font-size:12px}
pre.mall{white-space:pre-wrap;font:14px/1.55 var(--f-body);background:var(--soft);padding:12px;border-radius:8px;margin:0}
.mall-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin:12px 0 0}

.print-only{display:none}
.flow-print{padding-left:20px;margin:0}
.flow-print > li{margin-bottom:10px}
.flow-print ul{list-style:none;padding-left:0;margin:4px 0 0}
.flow-print ul li{margin:3px 0}
.utfall{display:inline;padding:1px 4px;border-radius:3px}
.utfall.hog{background:var(--hog-bg)} .utfall.medel{background:var(--medel-bg)} .utfall.lag{background:var(--lag-bg)}
@media print{
  .print-only{display:block!important}
  .note{font-size:7.5pt;padding-top:4px;margin:0;break-before:avoid}
  .sheet h2{margin-bottom:6px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  header.top,.stripe,.no-print,.back{display:none!important}
  body{background:#fff;color:#000;font-size:11pt}
  .card{border:none;padding:0}
  .sheet{gap:12px}
  .step .btns{display:none}
  section{break-inside:avoid}
}
</style>
</head>
<body>
<header class="top"><div class="wrap"><a href="#/">Riskbank BAS-P</a><span class="tag">Projektering · Produktion · Drift</span></div></header>
<div class="stripe"></div>
<main><div class="wrap" id="app"><p class="muted">Laddar riskbanken…</p></div></main>

<script type="module">
import { niva as nivaFor, relevans as relevansFor, relevansText as relText, profilVarningar as varnFor } from './lib/relevans.mjs';
(function(){
const app = document.getElementById('app');
let DB = null;
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let profil = store.get('basp.profil', {projekttyp: []});
let filter = {q:'', skede:'', omrade:'', byggdel:'', sr:false, visaEj:true};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const namn = (lista, id) => (DB.kategorier[lista].find(x => x.id === id) || {}).namn || id;
const niva = r => nivaFor(DB.skala, r);
const lvl = (s,k) => { const r = s*k; return `<span class="lvl ${niva(r).namn}" title="S ${s} × K ${k}">${r} ${niva(r).namn}</span>`; };

const relevans = risk => relevansFor(risk, profil);
const harProfil = () => Object.values(profil).some(v => Array.isArray(v) ? v.length : v !== '' && v != null);
const profilVarningar = risk => varnFor(risk, profil);

/* ---------- Bank ---------- */
function renderBank(){
  const k = DB.kategorier;
  const profilHtml = DB.profilfragor.map(q => {
    if (q.typ === 'flerval') return `<div class="q"><label class="ql">${esc(q.fraga)}</label><div class="chips">${
      k[q.kalla].map(o => `<button class="chip" data-p="${q.id}" data-multi="1" data-v="${o.id}" aria-pressed="${(profil[q.id]||[]).includes(o.id)}">${esc(o.namn)}</button>`).join('')}</div></div>`;
    if (q.typ === 'ar') return `<div class="q"><label class="ql" for="p-${q.id}">${esc(q.fraga)}</label><input type="number" inputmode="numeric" id="p-${q.id}" data-p="${q.id}" min="1700" max="2100" placeholder="t.ex. 1968" value="${esc(profil[q.id]||'')}"><div class="small muted">${esc(q.hjalp||'')}</div></div>`;
    return `<div class="q"><label class="ql">${esc(q.fraga)}</label><div class="chips">${
      q.alternativ.map(a => `<button class="chip" data-p="${q.id}" data-v="${a}" aria-pressed="${profil[q.id]===a}">${esc(a)}</button>`).join('')}</div></div>`;
  }).join('');

  const chipRow = (label, key, lista, getId = o => o.id, getName = o => o.namn) =>
    `<div class="row"><span>${label}</span><button class="chip" data-f="${key}" data-v="" aria-pressed="${!filter[key]}">Alla</button>${
      lista.map(o => `<button class="chip" data-f="${key}" data-v="${getId(o)}" aria-pressed="${filter[key]===getId(o)}">${esc(getName(o))}</button>`).join('')}</div>`;

  app.innerHTML = `
  <div class="bank">
    <aside class="card panel">
      <h2>Projektprofil</h2>
      <p class="small muted" style="margin:0">Svara på frågorna så sorteras banken efter vad som är aktuellt i just ditt projekt.</p>
      ${profilHtml}
      <div class="chips" style="margin-top:14px"><button class="btn" id="export">Exportera projekt.json</button><label class="btn" for="import">Importera…</label><input type="file" id="import" accept=".json,application/json" hidden><button class="btn" id="nollstall">Nollställ</button></div>
      <p class="small muted">Exporterad profil läggs i <code>projekt/&lt;namn&gt;/projekt.json</code> – sedan kan Claude granska handlingarna mot den.</p>
    </aside>
    <section>
      <div class="filters">
        <input type="search" id="q" placeholder="Sök risk, material, byggdel…" value="${esc(filter.q)}">
        ${chipRow('Skede', 'skede', k.skeden)}
        ${chipRow('Riskområde', 'omrade', k.riskomraden)}
        ${chipRow('Byggdel', 'byggdel', k.byggdelar)}
        <div class="row">
          <button class="chip" data-t="sr" aria-pressed="${filter.sr}">Endast arbeten med särskild risk</button>
          <button class="chip" data-t="visaEj" aria-pressed="${filter.visaEj}">Visa ej aktuella</button>
        </div>
      </div>
      <div id="lista"></div>
    </section>
  </div>`;

  app.querySelectorAll('[data-p]').forEach(el => {
    if (el.tagName === 'INPUT') el.addEventListener('input', () => { profil[el.dataset.p] = el.value ? +el.value : ''; spara(); renderLista(); });
    else el.addEventListener('click', () => {
      const id = el.dataset.p, v = el.dataset.v;
      if (el.dataset.multi){ const a = profil[id] || []; profil[id] = a.includes(v) ? a.filter(x => x !== v) : [...a, v]; el.setAttribute('aria-pressed', profil[id].includes(v)); }
      else { profil[id] = profil[id] === v ? '' : v; app.querySelectorAll(`[data-p="${id}"]`).forEach(b => b.setAttribute('aria-pressed', profil[id] === b.dataset.v)); }
      spara(); renderLista();
    });
  });
  app.querySelectorAll('[data-f]').forEach(el => el.addEventListener('click', () => {
    filter[el.dataset.f] = el.dataset.v;
    app.querySelectorAll(`[data-f="${el.dataset.f}"]`).forEach(b => b.setAttribute('aria-pressed', b.dataset.v === filter[el.dataset.f]));
    renderLista();
  }));
  app.querySelectorAll('[data-t]').forEach(el => el.addEventListener('click', () => {
    filter[el.dataset.t] = !filter[el.dataset.t]; el.setAttribute('aria-pressed', filter[el.dataset.t]); renderLista();
  }));
  app.querySelector('#q').addEventListener('input', e => { filter.q = e.target.value; renderLista(); });
  app.querySelector('#nollstall').addEventListener('click', () => { profil = {projekttyp: []}; spara(); renderBank(); });
  app.querySelector('#export').addEventListener('click', () => {
    const namn = prompt('Projektnamn', 'Nytt projekt'); if (namn === null) return;
    const data = {namn, datum: new Date().toISOString().slice(0, 10), profil};
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'}));
    a.download = 'projekt.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  app.querySelector('#import').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const d = JSON.parse(await f.text()); profil = Object.assign({projekttyp: []}, d.profil || d); spara(); renderBank(); }
    catch(err){ alert('Kunde inte läsa filen: ' + err.message); }
  });
  renderLista();
}
function spara(){ store.set('basp.profil', profil); }

function renderLista(){
  const q = filter.q.trim().toLowerCase();
  const ordning = {ja:0, mojlig:1, nej:2};
  const rows = DB.risker.map(r => ({r, rel: relevans(r)})).filter(({r, rel}) => {
    if (filter.skede && !r.skeden.includes(filter.skede)) return false;
    if (filter.omrade && r.riskomrade !== filter.omrade) return false;
    if (filter.byggdel && !(r.byggdelar||[]).includes(filter.byggdel)) return false;
    if (filter.sr && !(r.sarskildRisk||[]).length) return false;
    if (!filter.visaEj && rel === 'nej') return false;
    if (q){
      const hay = [r.titel, r.ingress, ...(r.sokord||[]), ...(r.forekomst||[]).map(f => f.plats + ' ' + f.exempel)].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a, b) => ordning[a.rel] - ordning[b.rel] || (b.r.riskFore.s*b.r.riskFore.k) - (a.r.riskFore.s*a.r.riskFore.k));

  const el = document.getElementById('lista');
  el.innerHTML = `<div class="count">${rows.length} av ${DB.risker.length} risker</div><div class="list">${rows.map(({r, rel}) => `
    <a class="card item ${rel==='nej'?'dim':''}" href="#/risk/${r.id}">
      <div><h3>${esc(r.titel)}</h3><div class="small muted">${esc(r.ingress)}</div></div>
      <div class="levels">${lvl(r.riskFore.s, r.riskFore.k)}<span class="arrow">→</span>${lvl(r.riskEfter.s, r.riskEfter.k)}</div>
      <div class="meta">
        <span class="rel ${rel}">${relText[rel]}</span>
        ${(r.sarskildRisk||[]).map(n => `<span class="pill sr" title="${esc(DB.kategorier.sarskildRisk.find(x=>x.nr===n).text)}">Särskild risk ${n}</span>`).join('')}
        ${r.skeden.map(s => `<span class="pill">${esc(namn('skeden', s))}</span>`).join('')}
        ${r.status === 'bas' ? '<span class="pill draft">Grundblad</span>' : ''}
        ${r.allman ? '<span class="pill" title="Finns på alla byggarbetsplatser – kontrolleras mot arbetsmiljöplanen">Allmän risk</span>' : ''}
        ${profilVarningar(r).some(v => v.niva==='hog') && rel!=='nej' ? '<span class="rel ja">⚠ Åtgärd i profil</span>' : ''}
      </div>
    </a>`).join('') || '<p class="muted">Inga risker matchar filtret.</p>'}</div>`;
}

/* ---------- Riskblad ---------- */
function matrix(r){
  let cells = '';
  for (let s = 4; s >= 1; s--){
    cells += `<div class="ax">${s}</div>`;
    for (let k = 1; k <= 4; k++){
      const cls = [niva(s*k).namn];
      if (s === r.riskFore.s && k === r.riskFore.k) cls.push('fore');
      if (s === r.riskEfter.s && k === r.riskEfter.k) cls.push('efter');
      cells += `<div class="cell ${cls.join(' ')}">${s*k}</div>`;
    }
  }
  cells += '<div></div>' + [1,2,3,4].map(k => `<div class="ax">${k}</div>`).join('');
  return `<div><div class="matrix" role="img" aria-label="Riskmatris, sannolikhet ${r.riskFore.s} gånger konsekvens ${r.riskFore.k} före, ${r.riskEfter.s} gånger ${r.riskEfter.k} efter åtgärd">${cells}</div>
    <div class="small muted" style="margin-top:4px">Sannolikhet ↑ · Konsekvens →</div></div>`;
}

function renderRisk(id){
  const r = DB.risker.find(x => x.id === id);
  if (!r){ app.innerHTML = `<p>Risken hittades inte. <a href="#/">Till banken</a></p>`; return; }
  const k = DB.kategorier, rel = relevans(r), varn = profilVarningar(r);
  const sec = (title, body) => body ? `<section class="card"><h2>${title}</h2>${body}</section>` : '';
  const skFor = id => esc(namn('skeden', id));

  const atgarderHtml = (r.atgarder||[]).length ? `<div class="tbl-scroll"><table><thead><tr><th>Skede</th><th>Ansvar</th><th>Åtgärd</th></tr></thead><tbody>${
    r.atgarder.map(a => `<tr><td class="sk">${skFor(a.skede)}</td><td class="sk">${esc(a.ansvar)}</td><td>${esc(a.atgard)}</td></tr>`).join('')}</tbody></table></div>` : '';

  const chk = store.get('basp.check.' + r.id, {});
  const granskHtml = (r.granskning||[]).length ? `<div class="checklist">${r.granskning.map((g, i) =>
    `<label><input type="checkbox" data-c="${i}" ${chk[i]?'checked':''}><span><code class="gid">${esc(g.id||'')}</code> ${esc(g.fraga)}${g.underlag ? `<br><span class="small muted">Underlag: ${esc(g.underlag.join(', '))}</span>` : ''}</span><span class="pill sk">${skFor(g.skede)}</span></label>`).join('')}</div>` : '';

  const mall = (rubrik, txt, key) => txt ? `<div style="margin-top:12px"><div class="mall-head"><h3>${rubrik}</h3><button class="btn no-print" data-copy="${key}">Kopiera</button></div><pre class="mall">${esc(txt)}</pre></div>` : '';

  app.innerHTML = `
  <article class="sheet">
    <div class="sheet-head">
      <a class="back" href="#/">← Tillbaka till riskbanken</a>
      <h1>${esc(r.titel)}</h1>
      <div class="chips">
        ${harProfil() ? `<span class="rel ${rel}">${relText[rel]}</span>` : ''}
        ${(r.sarskildRisk||[]).map(n => `<span class="pill sr">Särskild risk ${n}: ${esc(k.sarskildRisk.find(x=>x.nr===n).text)}</span>`).join('')}
        <span class="pill">${esc(namn('riskomraden', r.riskomrade))}</span>
        ${r.skeden.map(s => `<span class="pill">${skFor(s)}</span>`).join('')}
        ${r.projekttyper.map(p => `<span class="pill">${esc(namn('projekttyper', p))}</span>`).join('')}
        ${r.status === 'bas' ? '<span class="pill draft">Grundblad – kan fördjupas</span>' : ''}
        ${r.allman ? `<span class="pill">Allmän risk – ${esc(DB.allmanText || '')}</span>` : ''}
      </div>
      <p class="ingress">${esc(r.ingress)}</p>
      ${varn.map(v => `<div class="alert ${v.niva==='medel'?'medel':''}"><b>Utifrån projektprofilen</b>${esc(v.text)}</div>`).join('')}
      <div class="no-print"><button class="btn" onclick="print()">Skriv ut / spara som PDF</button></div>
    </div>

    <div class="grid2">
      ${sec('Risknivå', `<div class="matrix-wrap">${matrix(r)}<div class="matrix-legend">
        <div><span class="mk f"></span><b>Före åtgärd:</b> ${lvl(r.riskFore.s, r.riskFore.k)}<br><span class="muted">${esc(r.riskFore.motivering)}</span></div>
        <div><span class="mk e"></span><b>Efter åtgärd:</b> ${lvl(r.riskEfter.s, r.riskEfter.k)}<br><span class="muted">${esc(r.riskEfter.motivering)}</span></div>
      </div></div>`)}
      ${sec('Vad består risken av?', (r.vadArRisken||[]).map(p => `<p style="margin:0 0 10px">${esc(p)}</p>`).join('') || `<p class="muted">${esc(r.ingress)}</p>`)}
    </div>

    ${r.relevans && r.relevans.motivering ? sec('När är risken aktuell?', `<p style="margin:0">${esc(r.relevans.motivering)}</p>`) : ''}

    ${sec('Var kan risken förekomma?', (r.forekomst||[]).length ? `<div class="forekomst">${r.forekomst.map(f => `<div class="f"><b>${esc(f.plats)}</b><span class="small">${esc(f.exempel)}</span></div>`).join('')}</div>` : '')}

    ${(r.indikatorer||[]).length ? sec('Leta efter i handlingarna', `<div class="chips">${r.indikatorer.map(x => `<span class="pill">${esc(x)}</span>`).join('')}</div>`) : ''}

    ${(r.beslutsflode||[]).length ? sec('Bedöm i ditt projekt', `<p class="small muted no-print" style="margin-top:0">Gå igenom frågorna – resultatet visar hur risken ska omhändertas.</p><div class="flow no-print" id="flow"></div>${flowPrint(r)}`) : ''}

    ${sec('Hur omhändertas risken?', atgarderHtml)}

    ${sec('Kontrollfrågor vid granskning av handlingar', granskHtml ? granskHtml + '<p class="small muted no-print">Bockarna sparas i den här webbläsaren.</p>' : '')}

    ${(r.textArbetsmiljoplan || r.textHandlingar) ? sec('Textmallar', mall('Till arbetsmiljöplanen', r.textArbetsmiljoplan, 'textArbetsmiljoplan') + mall('Till beskrivning / AF', r.textHandlingar, 'textHandlingar')) : ''}

    ${sec('Regler och stöd', (r.regler||[]).length ? `<ul class="plain">${r.regler.map(x => `<li><b>${esc(x.ref)}</b> – ${esc(x.text)}</li>`).join('')}</ul><p class="note">${esc(DB.anmarkning)}</p>` : '')}

    ${(r.kallor||[]).length ? sec('Källor', `<ul class="plain">${r.kallor.map(x => `<li><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.titel)}</a></li>`).join('')}</ul>`) : ''}

  </article>`;

  app.querySelectorAll('[data-c]').forEach(el => el.addEventListener('change', () => {
    const c = store.get('basp.check.' + r.id, {}); c[el.dataset.c] = el.checked; store.set('basp.check.' + r.id, c);
  }));
  app.querySelectorAll('[data-copy]').forEach(el => el.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(r[el.dataset.copy]); el.textContent = 'Kopierat'; }
    catch(e){ el.textContent = 'Markera och kopiera manuellt'; }
    setTimeout(() => el.textContent = 'Kopiera', 1800);
  }));
  if ((r.beslutsflode||[]).length) runFlow(r);
  window.scrollTo(0, 0);
}

function flowPrint(r){
  const nr = Object.fromEntries(r.beslutsflode.map((s, i) => [s.id, i + 1]));
  const gren = (svar, m) => typeof m === 'string'
    ? `<li><b>${svar}</b> → gå till fråga ${nr[m]}</li>`
    : `<li><b>${svar}</b> → <span class="utfall ${m.niva || 'lag'}">${esc(m.slut)}</span></li>`;
  return `<ol class="print-only flow-print">${r.beslutsflode.map(s => `<li><b>${esc(s.fraga)}</b><ul>${gren('Ja', s.ja)}${gren('Nej', s.nej)}</ul></li>`).join('')}</ol>`;
}

function runFlow(r){
  const box = document.getElementById('flow');
  const steps = Object.fromEntries(r.beslutsflode.map(s => [s.id, s]));
  const path = [];
  function draw(){
    let html = '', cur = r.beslutsflode[0].id, i = 0, end = null;
    while (cur){
      const s = steps[cur]; i++;
      const svar = path[i-1];
      html += `<div class="step ${svar?'answered':''}"><div class="n">Fråga ${i}</div><div>${esc(s.fraga)}</div>${
        svar ? `<div class="ans">${svar === 'ja' ? 'Ja' : 'Nej'}</div>`
             : `<div class="btns"><button class="btn primary" data-a="ja" data-i="${i-1}">Ja</button><button class="btn" data-a="nej" data-i="${i-1}">Nej</button></div>`}</div>`;
      if (!svar) break;
      const next = s[svar];
      if (typeof next === 'string') cur = next; else { end = next; cur = null; }
    }
    if (end) html += `<div class="result ${end.niva || 'lag'}">${esc(end.slut)}</div>`;
    if (path.length) html += `<div class="no-print"><button class="btn" data-reset>Börja om</button></div>`;
    box.innerHTML = html;
    box.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', () => { path.length = +b.dataset.i; path.push(b.dataset.a); draw(); }));
    const rs = box.querySelector('[data-reset]'); if (rs) rs.addEventListener('click', () => { path.length = 0; draw(); });
  }
  draw();
}

function route(){
  const m = location.hash.match(/^#\/risk\/([\w-]+)/);
  if (m) renderRisk(m[1]); else renderBank();
}
fetch('riskbank.json').then(r => r.json()).then(d => { DB = d; route(); window.addEventListener('hashchange', route); })
  .catch(() => { app.innerHTML = '<p>Kunde inte läsa riskbank.json. Öppna sidan via en webbserver (t.ex. GitHub Pages).</p>'; });
})();
</script>
</body>
</html>
