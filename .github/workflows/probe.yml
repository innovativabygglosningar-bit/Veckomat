name: Probe
on:
  push:
    paths: ["scripts/probe-sites.mjs", ".github/workflows/probe.yml"]
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/probe-sites.mjs
