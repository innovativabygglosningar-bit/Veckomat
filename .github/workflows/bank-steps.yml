name: Spara receptsteg
on:
  push:
    paths: ["recipes.json", "scripts/bank-steps.mjs", ".github/workflows/bank-steps.yml"]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/bank-steps.mjs
