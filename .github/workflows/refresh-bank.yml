name: Hämta riktiga recept
on:
  push:
    paths: ["bank-targets.json", "scripts/refresh-bank.mjs", ".github/workflows/refresh-bank.yml"]
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/refresh-bank.mjs
      - uses: actions/upload-artifact@v4
        with: { name: bank-raw, path: bank-raw.json, retention-days: 7 }
